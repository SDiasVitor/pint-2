server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # chamadas da API vao para o container do Node-RED
    location /api/ {
        proxy_pass http://nodered:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: qualquer outra rota abre o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
